# Scratch only: can Eye's native core (Swift + LiteRT) be built for Windows and loaded from Bun?
name: Eye Windows proto
on: workflow_dispatch
jobs:
    build:
        runs-on: windows-2025
        steps:
            - uses: actions/checkout@v7
            - uses: actions/checkout@v7
              with:
                  repository: Desert-Ant-Labs/desert-ant-core
                  ref: 86b9b55fe8c61ec1c27c5b6383f545c6df1d6ceb # v4.1.0
                  path: dal
                  persist-credentials: false
            - uses: compnerd/gha-setup-swift@v0.4.0
              with:
                  branch: swift-6.2.1-release
                  tag: 6.2.1-RELEASE
            - uses: ilammy/msvc-dev-cmd@v1
            - name: Vendor LiteRT
              shell: pwsh
              working-directory: dal
              run: Tools/windows/vendor-litert.ps1
            # Eye needs no ONNX Runtime: only Voz uses it, and Inference's OnnxSession.swift is
            # behind #if canImport(COnnxRuntime). Without the edge EyeNode.dll links no onnxruntime.
            - name: Drop ONNX Runtime from Inference
              shell: bash
              working-directory: dal
              run: |
                  grep -q '] + jsWasi + jsEventLoop + onnxProducts' Package.swift
                  sed -i 's/\] + jsWasi + jsEventLoop + onnxProducts/] + jsWasi + jsEventLoop/' Package.swift
            - name: Build EyeNode
              shell: pwsh
              working-directory: dal
              run: |
                  # The dal_* C ABI lives in modules linked statically into the DLL, and Windows
                  # exports nothing from a static library unless told to.
                  $exports = "eye_create dal_is_downloaded dal_download dal_run dal_destroy dal_flush_telemetry dal_buffer_free dal_call_group_end".Split(" ") | ForEach-Object { "-Xlinker", "/EXPORT:$_" }
                  swift build --scratch-path ../b -c release --product EyeNode -Xlinker /LIBPATH:Vendor/litert/lib/windows-x64 @exports
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            - name: Collect DLLs
              shell: pwsh
              run: |
                  $dll = (Get-ChildItem -Recurse b -Filter EyeNode.dll | Select-Object -First 1).FullName
                  "built: $dll"
                  New-Item -ItemType Directory -Force native | Out-Null
                  Copy-Item $dll native/
                  Copy-Item dal/Vendor/litert/lib/windows-x64/libLiteRt.dll native/
                  # The MSVC C++ runtime, app-local from Visual Studio's redistributable folder.
                  $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
                  "crt: $($crt.FullName)"
                  Copy-Item "$($crt.FullName)\*.dll" native/
                  # Transitive closure of non-system imports, found on PATH (the Swift runtime).
                  $queue = [System.Collections.Queue]::new(); $queue.Enqueue("native/EyeNode.dll"); $queue.Enqueue("native/libLiteRt.dll")
                  $seen = @{}
                  while ($queue.Count) {
                      $f = $queue.Dequeue()
                      foreach ($dep in (dumpbin /dependents $f | Select-String '^\s+(\S+\.dll)$' | ForEach-Object { $_.Matches[0].Groups[1].Value })) {
                          $key = $dep.ToLower(); if ($seen[$key]) { continue }; $seen[$key] = $true
                          if (Test-Path "native/$dep") { $queue.Enqueue("native/$dep"); continue }
                          $hit = where.exe $dep 2>$null | Select-Object -First 1
                          if (-not $hit) { "unresolved: $dep"; continue }
                          if ($hit -match '\\Windows\\') { "system: $dep"; continue }
                          "bundle: $dep <- $hit"
                          Copy-Item $hit native/; $queue.Enqueue("native/$dep")
                      }
                  }
                  Get-ChildItem native | Format-Table Name, Length
            - uses: actions/upload-artifact@v7
              with:
                  name: eye-native-win32-x64
                  path: native/
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4
            - name: Load from Bun
              shell: bash
              run: |
                  bun install --frozen-lockfile
                  bun run vendor || true
                  ls models
                  mkdir -p node_modules/@desert-ant-labs/eye/native/win32-x64
                  cp native/* node_modules/@desert-ant-labs/eye/native/win32-x64/
                  export PATH="$PWD/node_modules/@desert-ant-labs/eye/native/win32-x64:$PATH"
                  bun .github/proto/eye-test.ts "$PWD/models"
