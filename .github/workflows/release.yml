# Versioning and releases, driven by Conventional Commits (see CLAUDE.md, Conventions).
#
# Every push to main lets release-please update an open release PR: the next version (from the
# commit types since the last release: fix -> patch, feat -> minor, while < 1.0 a breaking
# change -> minor too) in package.json and .release-please-manifest.json, plus CHANGELOG.md.
# Merging that PR tags vX.Y.Z and creates the GitHub release; the package jobs then build
# from that tag and attach the Linux AppImage, the macOS (arm64, unsigned) zip + dmg and the
# Windows (x64, unsigned) zip, each with its checksum, to the release.
#
# A manual run (workflow_dispatch) only builds and keeps the packages as workflow artifacts,
# to check the build without releasing anything. Given a `tag`, it builds that tag instead and
# attaches the packages to its existing release: v0.2.0 was released while the appimage job
# failed, and release-please never reports the same release as created twice.

name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            tag:
                description: "Existing release tag (vX.Y.Z) to rebuild and attach the AppImage to; empty = build only"
                required: false
                default: ""

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release-please:
        if: github.event_name == 'push'
        runs-on: ubuntu-24.04
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - uses: googleapis/release-please-action@v5
              id: release
              with:
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    package:
        needs: release-please
        # On a manual run release-please is skipped, which would skip this job too without
        # !cancelled().
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
        strategy:
            # A failing macOS build must not keep the AppImage off the release.
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-24.04
                      target: linux
                    # Apple silicon: Eye ships a native core for darwin-arm64 only.
                    - os: macos-15
                      target: macos
                    - os: windows-2025
                      target: windows
        name: package (${{ matrix.target }})
        runs-on: ${{ matrix.os }}
        env:
            TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ env.TAG || github.ref }}

            # mksquashfs assembles the AppImage; lzip unpacks the libjxl release tarball.
            # cjxl 0.12 Brotli-compresses the Exif box (brob), and exiftool reads or updates it
            # only with IO::Uncompress::Brotli. Without it the EXIF self-test failed every
            # runConvert test: exiftool reported the .jxl "unchanged" and Artist read back "".
            - name: Install build tools
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools lzip libio-compress-brotli-perl

            # The same Brotli module for the macOS perl. cmake (for building cjxl/djxl, see
            # fetch-vendor.ts) is preinstalled on the runner image.
            - name: Install build tools
              if: runner.os == 'macOS'
              # IO::Compress::Brotli builds through Alien::cmake3, which failed intermittently on
              # the runner (once building, once configuring; the next run passed). Retried, with
              # cpanm's build log printed so a failure that stays is readable.
              run: |
                  brew install cpanminus
                  for attempt in 1 2 3; do
                      cpanm --notest IO::Compress::Brotli && break
                      tail -n 60 ~/.cpanm/build.log || true
                      [ "$attempt" = 3 ] && exit 1
                      sleep 15
                  done
                  perl -MIO::Uncompress::Brotli -e 'print "perl Brotli ok\n"'

            # The same Bun as locally: the packaged app ships this binary as resources/app/bin/bun.
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4

            # cjxl/djxl, the LiteRT accelerator, the Eye weights and the AppImage runtime are pinned
            # by checksum in fetch-vendor.ts, so the script's content is the cache key. On macOS
            # this also keeps the cjxl/djxl built from source (several minutes) between runs.
            - uses: actions/cache@v6
              id: vendor
              with:
                  path: |
                      vendor
                      models
                  key: vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-vendor.ts') }}

            # Windows builds Eye's native core from source (fetch-vendor.ts, buildEyeWindows), which
            # needs the Swift toolchain the desert-ant-core CI builds it with, plus an MSVC
            # environment for the C++ runtime it ships. Only when vendor/ isn't cached.
            - uses: compnerd/gha-setup-swift@v0.4.0
              if: runner.os == 'Windows' && steps.vendor.outputs.cache-hit != 'true'
              with:
                  branch: swift-6.2.1-release
                  tag: 6.2.1-RELEASE
            - uses: ilammy/msvc-dev-cmd@v1
              if: runner.os == 'Windows' && steps.vendor.outputs.cache-hit != 'true'

            - uses: actions/cache@v6
              with:
                  path: |
                      ~/.cache/electron
                      ~/Library/Caches/electron
                      ~/AppData/Local/electron/Cache
                  key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}

            - run: bun install --frozen-lockfile
            - run: bun run vendor
            - run: bun run typecheck
            - run: bun test
            - run: bun run package

            - name: Checksums
              working-directory: artifacts
              shell: bash
              run: |
                  shopt -s nullglob
                  # sha256sum on Linux and in Git Bash on Windows; macOS has only shasum. Same output.
                  sum="sha256sum"; command -v sha256sum > /dev/null || sum="shasum -a 256"
                  for f in *.AppImage *.zip *.dmg; do $sum "$f" > "$f.sha256"; done
                  ls -l

            - name: Attach to release
              if: env.TAG != ''
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release upload "$TAG" artifacts/* --clobber

            - name: Keep as workflow artifact
              if: env.TAG == ''
              uses: actions/upload-artifact@v7
              with:
                  name: Cataglyph-${{ matrix.target }}
                  path: artifacts/*
